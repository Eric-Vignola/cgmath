# Packaging for `cgmath`.
#
# The repository root IS the package: `__init__.py` and `utils.py` sit at the
# top level and the modules import each other absolutely (`from cgmath...`),
# so the directory must be installed UNDER the name `cgmath`. That is what
# `package-dir` does below; without it setuptools' flat-layout discovery would
# install `constraints`, `geometry`, `render` and friends as TOP-LEVEL
# packages, which would both collide with other distributions and break every
# absolute import in the library.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name            = "cgmath"
version         = "1.0.0"
description     = "A DCC-agnostic CG math library: mesh topology, deformers, resampling, skeletal hierarchies, SDFs, a software raytracer and asset IO, all numpy-native."
readme          = "README.md"
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Eric Vignola", email = "eric.vignola@gmail.com" }]
keywords        = ["cg", "vfx", "rigging", "mesh", "topology", "deformer", "skinning", "rbf", "sdf", "raytracer", "usd", "gltf", "numpy", "numba"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# FOUR of these are the real dependencies -- numpy, scipy, numba and
# transforms. Without them cgmath does not import. Everything after them is
# OPTIONAL to the library: each is imported under a guard that degrades to
# None, so cgmath runs without it and only the feature named beside it goes
# quiet.
#
# They are declared as requirements anyway, deliberately. A plain
# `pip install` should hand somebody a complete tool rather than a core that
# silently lacks half its file formats, and every one of them is a wheel on
# PyPI that costs nothing but disk. Anyone who wants the four alone can
# install them and drop the package on sys.path, which is how this library
# was used before it was packaged.
dependencies = [
    # --- core ---------------------------------------------------------
    "numpy",
    "scipy",
    "numba",
    # Not on PyPI, so it is declared as a direct reference. `pip install` of
    # this wheel fetches and builds it from GitHub; that repository carries
    # its own pyproject.toml for exactly this reason.
    #
    # PINNED to the 1.0.0 tag rather than tracking the default branch, so this
    # release resolves to one fixed commit and cannot be changed under it by
    # later work upstream. Bumping cgmath against a newer transforms means
    # moving this ref deliberately.
    "transforms @ git+https://github.com/Eric-Vignola/transforms@1.0.0",

    # --- optional: installed for convenience, guarded in the source -----
    "pillow",         # image read/write behind textures, frames and scenes
    "opencv-python",  # image ops in geometry.mesh and render.scene
    "scikit-image",   # image measurement helpers in geometry.mesh
    "pygltflib",      # GLB/glTF read and write, and the hierarchy importer
    "trimesh",        # mesh interchange behind the GLB path
    "usd-core",       # USD stage and prim reading
    # Declared for completeness, but the video and gif encoders shell out to
    # the ffmpeg BINARY rather than to this binding: `ffmpeg` has to be on
    # PATH for mp4 / avi output, and installing this package does not put it
    # there.
    "ffmpeg-python",
]

[project.urls]
Homepage      = "https://github.com/Eric-Vignola/cgmath"
Source        = "https://github.com/Eric-Vignola/cgmath"
Documentation = "https://github.com/Eric-Vignola/cgmath/blob/main/REFERENCE.md"

[tool.setuptools]
# The root maps to the package name; every subpackage is then addressed
# relative to it. `_tests` is deliberately absent -- the suite and its 25
# binary fixtures are not part of the installed library.
package-dir = { "cgmath" = "." }
packages    = [
    "cgmath",
    "cgmath.constraints",
    "cgmath.formats",
    "cgmath.formats.usd",
    "cgmath.geometry",
    "cgmath.geometry.deform",
    "cgmath.geometry.utils",
    "cgmath.geometry.utils._numba",
    "cgmath.hierarchy",
    "cgmath.rbf",
    "cgmath.rbf._numba",
    "cgmath.render",
    "cgmath.render._numba",
]
