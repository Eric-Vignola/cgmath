# Packaging for `cgmath`.
#
# The repository root IS the package: `__init__.py` and `utils.py` sit at the
# top level and the modules import each other absolutely (`from cgmath...`),
# so the directory must be installed UNDER the name `cgmath`. That is what
# `package-dir` does below; without it setuptools' flat-layout discovery would
# install `constraints`, `geometry`, `render` and friends as TOP-LEVEL
# packages, which would both collide with other distributions and break every
# absolute import in the library.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name            = "cgmath"
version         = "1.0.4"
description     = "A DCC-agnostic CG math library: batched matrix, quaternion and euler math, mesh topology, deformers, resampling, skeletal hierarchies, SDFs, a software raytracer and asset IO, all numpy-native."
readme          = "README.md"
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Eric Vignola", email = "eric.vignola@gmail.com" }]
keywords        = ["cg", "vfx", "rigging", "matrix", "quaternion", "euler", "mesh", "topology", "deformer", "skinning", "rbf", "sdf", "raytracer", "usd", "gltf", "numpy", "numba"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Only numpy, scipy and numba are required: without them cgmath does not
# import. Everything else is OPTIONAL to the library -- each is imported under
# a guard, so cgmath runs without it and only the feature named beside it
# complains -- and comes as an extra:
#
#   pip install cgmath                numpy, scipy and numba only
#   pip install "cgmath[gltf,usd]"    plus the chosen features
#   pip install "cgmath[all]"         everything on PyPI
#
# Up to 1.0.3 the extras were plain requirements, so that a bare
# `pip install` handed over the complete tool. That broke DCC hosts: usd-core
# brings its own `pxr`, and a second USD build on sys.path collides with the
# one Maya or Houdini has already loaded. So inside a DCC, leave `usd` out.
# The Autodesk FBX SDK is not on PyPI and is installed by hand.
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.optional-dependencies]
image = [
    "pillow",         # image read/write behind textures, frames and scenes
    "opencv-python",  # image ops in geometry.mesh and render.scene
    "scikit-image",   # image measurement helpers in geometry.mesh
]
gltf = [
    "pygltflib",      # GLB/glTF read and write, and the hierarchy importer
    "trimesh",        # mesh interchange behind the GLB path
]
usd = [
    "usd-core",       # USD stage and prim reading
]
all = [
    "pillow",
    "opencv-python",
    "scikit-image",
    "pygltflib",
    "trimesh",
    "usd-core",
]

[project.urls]
Homepage      = "https://github.com/Eric-Vignola/cgmath"
Source        = "https://github.com/Eric-Vignola/cgmath"
Documentation = "https://github.com/Eric-Vignola/cgmath/blob/main/REFERENCE.md"

[tool.setuptools]
# The root maps to the package name; every subpackage is then addressed
# relative to it. Both test suites ship, `_tests` and `transforms/_tests`, so
# `cgmath.utils.run_tests()` runs on an installed copy as it does on a
# checkout. The 32 fixtures they read sit in `_tests/test_assets`, a folder
# with no `__init__.py`: it is listed as a package all the same, which is how
# setuptools wants a data folder named (it warns otherwise), and its files
# ship as package data below. The repository's `tools/` and the markdown
# pages stay out of the wheel.
package-dir = { "cgmath" = "." }
packages    = [
    "cgmath",
    "cgmath._tests",
    "cgmath._tests.test_assets",
    "cgmath.constraints",
    "cgmath.formats",
    "cgmath.formats.usd",
    "cgmath.geometry",
    "cgmath.geometry.deform",
    "cgmath.geometry.utils",
    "cgmath.geometry.utils._numba",
    "cgmath.hierarchy",
    "cgmath.rbf",
    "cgmath.rbf._numba",
    "cgmath.render",
    "cgmath.render._numba",
    "cgmath.transforms",
    "cgmath.transforms._numba",
    "cgmath.transforms._tests",
]

[tool.setuptools.package-data]
"cgmath._tests.test_assets" = ["*"]
